name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/pty_smoke.py
      - run: python3 scripts/mode_smoke.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Windows PowerShell installer regression tests
        shell: powershell
        run: ./tests/installer_windows.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinpty==3.0.4
      - run: python scripts/windows_smoke.py target/debug/ticktop.exe
