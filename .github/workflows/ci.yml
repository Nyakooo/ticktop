name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - 'LICENSE*'

permissions:
  contents: read

# A newer commit on the same branch supersedes an unfinished CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests once
        run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r scripts/requirements-smoke.txt
      - name: Run terminal parser and installer regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
