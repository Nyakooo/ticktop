name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - 'LICENSE*'
      - '.github/workflows/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'docs/**'
      - 'LICENSE*'
      - '.github/workflows/**'

permissions:
  contents: read

# A newer commit on the same branch supersedes an unfinished CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests once
        run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r scripts/requirements-smoke.txt
      - name: Run terminal parser and installer regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Python for platform smoke tests
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ '${{ matrix.target }}' == 'x86_64-unknown-linux-musl' ]]; then
            sudo apt-get install -y zsh
          fi
          target='${{ matrix.target }}'
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
          upper_target="${target^^}"
          echo "CARGO_TARGET_${upper_target//-/_}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Configure static Windows runtime
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build release binary once
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Run Linux terminal smoke tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          python -m pip install -r scripts/requirements-smoke.txt
          python scripts/pty_smoke.py target/${{ matrix.target }}/release/ticktop
          python scripts/mode_smoke.py target/${{ matrix.target }}/release/ticktop
      - name: Run Windows installer regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer_windows.ps1
      - name: Install Windows ConPTY test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.2
      - name: Run Windows ConPTY smoke test
        if: runner.os == 'Windows'
        run: python scripts/windows_smoke.py target/${{ matrix.target }}/release/ticktop.exe
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/ticktop" dist/ticktop
          cd dist
          ./ticktop --version
          tar -czf "ticktop-$TARGET.tar.gz" ticktop
          if command -v sha256sum >/dev/null; then
            sha256sum "ticktop-$TARGET.tar.gz" > "ticktop-$TARGET.tar.gz.sha256"
          else
            shasum -a 256 "ticktop-$TARGET.tar.gz" > "ticktop-$TARGET.tar.gz.sha256"
          fi
          rm ticktop
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $target = '${{ matrix.target }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$target/release/ticktop.exe" dist/ticktop.exe
          & ./dist/ticktop.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Binary smoke failed' }
          $asset = "ticktop-$target.zip"
          Compress-Archive -LiteralPath dist/ticktop.exe -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) "$asset.sha256"), "$hash  $asset`n")
          Remove-Item dist/ticktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ticktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
