name: Release rebuild cleanup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/release-rebuild.yml']
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded build and remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          state=$(gh run view 41377464030 --json status --jq .status)
          if [ "$state" != completed ]; then
            gh run cancel 41377464030
          fi
          if gh release view v0.3.1 >/dev/null 2>&1; then
            gh release delete v0.3.1 --yes
          fi
