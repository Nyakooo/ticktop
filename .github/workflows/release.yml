name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Do not run two publishers for the same version tag concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          test "${GITHUB_REF_NAME#v}" = "$version"

  build:
    needs: validate
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Python for platform smoke tests
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [[ '${{ matrix.target }}' == 'x86_64-unknown-linux-musl' ]]; then
            sudo apt-get install -y zsh
          fi
          target='${{ matrix.target }}'
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"
          upper_target="${target^^}"
          echo "CARGO_TARGET_${upper_target//-/_}_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - name: Configure static Windows runtime
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build release binary once
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Run Linux terminal smoke tests
        env:
          TICKTOP_SMOKE_READ_SIZE: '257'
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          python -m pip install -r scripts/requirements-smoke.txt
          python scripts/pty_smoke.py target/${{ matrix.target }}/release/ticktop
          python scripts/mode_smoke.py target/${{ matrix.target }}/release/ticktop
      - name: Run Windows installer regression tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/installer_windows.ps1
      - name: Install Windows ConPTY test dependency
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.2
      - name: Run Windows ConPTY smoke test
        if: runner.os == 'Windows'
        run: python scripts/windows_smoke.py target/${{ matrix.target }}/release/ticktop.exe
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/ticktop" dist/ticktop
          cd dist
          ./ticktop --version
          tar -czf "ticktop-$TARGET.tar.gz" ticktop
          if command -v sha256sum >/dev/null; then
            sha256sum "ticktop-$TARGET.tar.gz" > "ticktop-$TARGET.tar.gz.sha256"
          else
            shasum -a 256 "ticktop-$TARGET.tar.gz" > "ticktop-$TARGET.tar.gz.sha256"
          fi
          rm ticktop
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $target = '${{ matrix.target }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$target/release/ticktop.exe" dist/ticktop.exe
          & ./dist/ticktop.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Binary smoke failed' }
          $asset = "ticktop-$target.zip"
          Compress-Archive -LiteralPath dist/ticktop.exe -DestinationPath "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) "$asset.sha256"), "$hash  $asset`n")
          Remove-Item dist/ticktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ticktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish release artifacts
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify all platform packages and checksums
        run: |
          set -euo pipefail
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          test "$count" -eq 10
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "Ticktop $TAG" --notes-file docs/RELEASE_NOTES.md

  verify-windows:
    name: Verify published Windows install and update
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Windows installation and self-update
        shell: powershell
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'Ticktop installed test'
          $env:TICKTOP_INSTALL_DIR = $directory
          $env:TICKTOP_NO_PATH = '1'
          $env:TICKTOP_VERSION = $env:GITHUB_REF_NAME
          $script = Invoke-RestMethod 'https://raw.githubusercontent.com/Nyakooo/ticktop/${{ github.ref_name }}/scripts/install.ps1'
          Invoke-Expression $script
          $exe = Join-Path $directory 'ticktop.exe'
          $installedVersion = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed binary failed' }
          if ($installedVersion -ne "ticktop $($env:TICKTOP_VERSION.Substring(1))") { throw 'Installed version mismatch' }
          & $exe update
          if ($LASTEXITCODE -ne 0) { throw 'Native self-update failed' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Updated binary failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinpty==3.0.2
      - name: Verify downloaded binary in Windows ConPTY
        shell: powershell
        run: python scripts/windows_smoke.py (Join-Path $env:RUNNER_TEMP 'Ticktop installed test\ticktop.exe')
