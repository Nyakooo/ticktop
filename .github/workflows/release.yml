name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Do not run two publishers for the same version tag concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish existing CI artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: Wait for successful CI run on this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 90); do
            runs="$(gh run list --repo "$GH_REPO" --workflow ci.yml --commit "$COMMIT_SHA" --branch master --event push --json databaseId,status,conclusion --limit 10)"
            latest="$(jq -c '.[0] // empty' <<< "$runs")"
            if [[ -n "$latest" ]]; then
              status="$(jq -r '.status' <<< "$latest")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$latest")"
              candidate="$(jq -r '.databaseId' <<< "$latest")"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" == "success" ]]; then
                  run_id="$candidate"
                  break
                fi
                echo "CI run $candidate completed with conclusion: $conclusion" >&2
                exit 1
              fi
            fi
            echo "Waiting for CI build ($attempt/90)..."
            sleep 20
          done
          if [[ -z "$run_id" ]]; then
            echo "No successful master CI build found for $COMMIT_SHA within 30 minutes." >&2
            exit 1
          fi
          echo "Using CI run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from the successful CI run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.ci.outputs.run_id }}
          path: dist
          merge-multiple: true

      - name: Verify all platform packages and checksums
        run: |
          set -euo pipefail
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          test "$count" -eq 10
          for checksum in dist/*.sha256; do
            (cd dist && sha256sum -c "$(basename "$checksum")")
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "Ticktop $TAG" --notes-file docs/RELEASE_NOTES.md

  verify-windows:
    name: Verify published Windows install and update
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify public Windows installation and self-update
        shell: powershell
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'Ticktop installed test'
          $env:TICKTOP_INSTALL_DIR = $directory
          $env:TICKTOP_NO_PATH = '1'
          $script = Invoke-RestMethod 'https://raw.githubusercontent.com/Nyakooo/ticktop/${{ github.ref_name }}/scripts/install.ps1'
          Invoke-Expression $script
          $exe = Join-Path $directory 'ticktop.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed binary failed' }
          & $exe update
          if ($LASTEXITCODE -ne 0) { throw 'Native self-update failed' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Updated binary failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinpty==3.0.2
      - name: Verify downloaded binary in Windows ConPTY
        shell: powershell
        run: python scripts/windows_smoke.py (Join-Path $env:RUNNER_TEMP 'Ticktop installed test\ticktop.exe')
